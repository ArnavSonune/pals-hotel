<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Pals Hotel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#ffffff;--alt:#eaf6fd;--ink:#12344d;--mute:#587186;--ac:#0e7c9c;--ac2:#ffd24d;--line:#d9ebf4;--sky:#bfe6fa;--sea:#2aa6c4;--green:#d9f4df;--green2:#7fd3a0;--yellow:#fff1b8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.6}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;line-height:1.05}
a{color:inherit;text-decoration:none}
section,.hero{scroll-margin-top:70px}
.wrap{max-width:1100px;margin:0 auto;padding:0 22px}
.eyebrow{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--ac);font-weight:600}
.btn{display:inline-block;background:var(--ac);color:#fff;padding:13px 26px;border-radius:40px;font-weight:600;font-size:14px;border:0;cursor:pointer;font-family:inherit;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px #0e7c9c44}
.btn.o{background:none;color:var(--ink);border:1px solid var(--ink)}
.note{background:var(--ink);color:#fff;text-align:center;font-size:12px;padding:7px 10px}
#bar{position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--ac2),var(--green2),var(--sea));transform-origin:0 50%;z-index:60}
header.nav{position:fixed;top:0;left:0;right:0;z-index:50;padding:calc(12px + env(safe-area-inset-top,0px)) 0 12px;transition:background .3s,box-shadow .3s}
header.nav.s{background:#ffffffe6;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 1px 0 var(--line)}
header.nav .wrap{display:flex;justify-content:space-between;align-items:center}
.logo{font-family:'Cormorant Garamond',Georgia,serif;font-size:28px;font-weight:600}
.logo b{color:var(--ac)}
.links{display:flex;gap:28px;font-size:14px;align-items:center}
.links a:not(.btn):hover{color:var(--ac)}
.photo{background:linear-gradient(135deg,#d6effc,#fff3c4);border:2px dashed #8cc9dd;color:#2b7a92;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:14px;width:100%;height:100%;min-height:160px}
.t1{background:linear-gradient(135deg,#dff5e1,#cfeefa)}.t2{background:linear-gradient(135deg,#fff1b8,#dff5e1)}.t3{background:linear-gradient(135deg,#bfe6fa,#dff5e1)}
.photo .cam{font-size:38px;line-height:1;margin-bottom:8px;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-7px)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 #0e7c9c66}70%{box-shadow:0 0 0 16px #0e7c9c00}100%{box-shadow:0 0 0 0 #0e7c9c00}}
@keyframes wv{to{transform:translateX(-50%)}}
.blob{position:absolute;border-radius:50%;filter:blur(46px);opacity:.75;pointer-events:none}
.sun{position:absolute;right:10vw;top:calc(12vh + env(safe-area-inset-top,0px));width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6c9,#ffd24d);box-shadow:0 0 60px #ffd24d99}
.sun::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:2px dashed #f2b705}
.mqw{overflow:hidden;padding:34px 0 10px}
.mq{background:var(--yellow);padding:14px 0;transform:rotate(-1.2deg);margin:0 -12px;overflow:hidden;border-block:1px solid #f4dc7d}
.mqt{display:flex;gap:44px;width:max-content;font-family:'Cormorant Garamond',Georgia,serif;font-size:28px;white-space:nowrap}
.mqt span:nth-child(3n+1){color:var(--ac)}
.wave{position:relative;height:70px;overflow:hidden;margin-top:40px}
.wave svg{position:absolute;bottom:0;left:0;width:200%;height:100%}
.photo b{font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.photo small{font-size:12px;opacity:.85;margin-top:3px}
.hero{height:230vh;position:relative}
.stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:linear-gradient(180deg,#eaf7fe 0%,#c4e8f8 45%,#8fd0ea 100%)}
.hw{position:absolute;left:0;right:0;bottom:0;height:12vh;margin:0}
.ttl .eyebrow{color:#0b5b75}
.frame{position:absolute;inset:0}
.ttl{position:absolute;top:0;left:0;right:0;padding-top:calc(13vh + env(safe-area-inset-top,0px));text-align:center}
.ttl h1{font-size:clamp(40px,7.4vw,96px);max-width:900px;margin:14px auto 0;padding:0 18px}
.wmask{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.1em}
.w{display:inline-block}
.over{position:absolute;left:0;right:0;bottom:0;padding:0 0 9vh}
.over h2{font-size:clamp(34px,5vw,64px)}
.over p{color:var(--mute);margin:8px 0 18px;max-width:440px}
.hint{position:absolute;bottom:1.8vh;left:0;right:0;text-align:center;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--mute)}
.book{margin-top:-4vh;position:relative;z-index:5}
.sbar{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 24px 60px #0e7c9c26;padding:20px;display:grid;grid-template-columns:repeat(4,1fr) auto;gap:14px;align-items:end}
.sbar label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);display:block;margin-bottom:5px}
.sbar input,.sbar select,.form input,.form select{width:100%;padding:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;border-radius:10px}
.rooms{height:290vh;position:relative;margin-top:30px}
.rstick{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:26px}
.track{display:flex;gap:24px;padding:0 22px 0 max(22px,calc((100vw - 1100px)/2 + 22px));width:max-content}
.rc{flex:0 0 min(80vw,420px);background:#fff;border:1px solid var(--line);border-radius:26px;padding:14px;box-shadow:0 14px 40px #0e7c9c1a}
.rc .ph{height:240px;border-radius:18px;overflow:hidden}
.rc h3{font-size:30px;margin:16px 8px 4px}
.rc p{color:var(--mute);font-size:14px;margin:0 8px 12px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 8px 16px}
.tags i{font-style:normal;font-size:12px;background:var(--alt);padding:4px 11px;border-radius:20px;color:var(--ac)}
.rc .row{display:flex;justify-content:space-between;align-items:center;margin:0 8px 6px}
.rc .row a.l{font-size:14px;font-weight:600;color:var(--ac)}
.intro{flex:0 0 min(80vw,340px);display:flex;flex-direction:column;justify-content:center}
.intro h2{font-size:clamp(40px,5vw,60px);margin:10px 0 14px}
.intro p{color:var(--mute)}
.prog{height:3px;background:var(--line);margin:0 22px;border-radius:3px;max-width:1056px;align-self:center;width:calc(100% - 44px)}
.prog div{height:100%;background:var(--ac);transform-origin:0 50%;border-radius:3px}
.stats{background:var(--alt);padding:70px 0}
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;text-align:center}
.sc{background:#fff;border-radius:22px;padding:26px 12px;box-shadow:0 10px 30px #0e7c9c14;transition:box-shadow .3s}.sc:hover{box-shadow:0 18px 40px #0e7c9c30}
.c0{border-top:5px solid var(--ac2)}.c1{border-top:5px solid var(--sea)}.c2{border-top:5px solid var(--green2)}.c3{border-top:5px solid var(--sky)}
.sg b{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(44px,6vw,70px);font-weight:500;color:var(--ac);display:block;line-height:1}
.sg span{font-size:14px;color:var(--mute)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center;padding:90px 0}
.split.r .tx{order:-1}
.split h2{font-size:clamp(34px,4.6vw,56px);margin:10px 0 14px}
.split p{color:var(--mute);margin-bottom:18px}
.para{overflow:hidden;border-radius:28px;height:min(58vh,500px)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips i{font-style:normal;font-size:13px;border:1px solid var(--line);background:#fff;padding:6px 14px;border-radius:30px}
.gal{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:210px;gap:14px}
.gal .a{grid-row:span 2}
.gal>div{border-radius:20px;overflow:hidden}
.gh{text-align:center;margin-bottom:34px}
.gh h2{font-size:clamp(34px,4.6vw,56px);margin-top:8px}
.enq{background:linear-gradient(135deg,var(--sky),var(--green));color:var(--ink);border-radius:32px;padding:56px;margin:90px 0;display:grid;grid-template-columns:1fr 1fr;gap:40px}
.enq h2{font-size:clamp(34px,4.4vw,54px);margin:10px 0 12px}
.enq p{color:#3f6178}
.enq .eyebrow{color:var(--ac)}
.form{display:grid;gap:12px}
.form .btn{background:var(--ac2);color:var(--ink)}
footer{background:var(--alt);padding:50px 0 40px;font-size:14px;color:var(--mute)}
footer .wrap{display:flex;justify-content:space-between;gap:30px;flex-wrap:wrap}
footer b{color:var(--ink)}
.call{animation:pulse 2.4s infinite;position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40}
@media(max-width:820px){.links a:not(.btn){display:none}.sbar{grid-template-columns:1fr 1fr}.sg{grid-template-columns:1fr 1fr;row-gap:34px}.split,.enq{grid-template-columns:1fr;gap:28px}.split.r .tx{order:0}.enq{padding:32px 22px;margin:60px 0}.gal{grid-template-columns:1fr 1fr}.over{padding-bottom:7vh}}
</style>
</head>
<body>
<div class="note">DESIGN CONCEPT · Dashed boxes = real hotel photos will be placed here · Scroll to explore</div>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/framer-motion@10.18.0/dist/framer-motion.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
const {motion,MotionConfig,useScroll,useTransform,useSpring,useInView,animate,useMotionValueEvent}=Motion;
const {useRef,useState,useEffect}=React;
const html=htm.bind(React.createElement);
// TODO: Replace with Pals Hotel's verified booking URL before launch.
const BOOK="#contact";
const ease=[.2,.7,.2,1];

const Photo=({label,sub})=>html`<div className=${"photo t"+((label+sub).length%4)}><span className="cam">📷</span><b>${label}</b><small>${sub}</small></div>`;

const Reveal=({children,delay=0,y=40,className=""})=>html`<${motion.div} className=${className} initial=${{opacity:0,y}} whileInView=${{opacity:1,y:0}} viewport=${{once:true,margin:"-80px"}} transition=${{duration:.9,delay,ease}}>${children}<//>`;

const WordsIn=({text})=>html`<span>${text.split(" ").map((w,i)=>html`<span key=${i} className="wmask"><${motion.span} className="w" initial=${{y:"110%",rotate:4}} whileInView=${{y:0,rotate:0}} viewport=${{once:true,margin:"-60px"}} transition=${{duration:.8,delay:i*.07,ease}}>${w}<//></span> `)}</span>`;

const Blob=({c,s,pos,dur,dx,dy})=>html`<${motion.div} className="blob" style=${{background:c,width:s,height:s,...pos}} animate=${{x:[0,dx,-dx/2,0],y:[0,dy,-dy/2,0],scale:[1,1.15,.95,1]}} transition=${{duration:dur,repeat:Infinity,ease:"easeInOut"}}/>`;

function Marquee(){
  const items=["Free Wi-Fi","Breakfast included","24×7 Room Service","Banquet & event spaces","Restaurant","Laundry","Doctor on call","Car hire"];
  const row=items.concat(items);
  return html`<div className="mqw"><div className="mq"><${motion.div} className="mqt" animate=${{x:["0%","-50%"]}} transition=${{duration:32,ease:"linear",repeat:Infinity}}>${row.map((t,i)=>html`<span key=${i}>${t} ✦</span>`)}<//></div></div>`;
}

function Wave({cols=["#d9f4df","#bfe6fa","#eaf6fd"],cls=""}){
  const d="M0 40 Q180 0 360 40 T720 40 T1080 40 T1440 40 T1800 40 T2160 40 T2520 40 T2880 40 V80 H0Z";
  const L=(fill,dur,rev,op)=>html`<svg viewBox="0 0 2880 80" preserveAspectRatio="none" style=${{animation:"wv "+dur+"s linear infinite"+(rev?" reverse":""),opacity:op}}><path d=${d} fill=${fill}/></svg>`;
  return html`<div className=${"wave "+cls}>${L(cols[0],16,true,1)}${L(cols[1],22,false,.7)}${L(cols[2],12,false,1)}</div>`;
}

const Words=({text,delay=0})=>html`<span>${text.split(" ").map((w,i)=>html`<span key=${i} className="wmask"><${motion.span} className="w" initial=${{y:"110%"}} animate=${{y:0}} transition=${{duration:.9,delay:delay+i*.09,ease}}>${w}<//></span> `)}</span>`;

function Counter({to,dec=0}){
  const ref=useRef(null);const inView=useInView(ref,{once:true});const [v,setV]=useState(0);
  useEffect(()=>{if(!inView)return;const c=animate(0,to,{duration:1.8,ease:"easeOut",onUpdate:setV});return()=>c.stop()},[inView]);
  return html`<span ref=${ref}>${dec?v.toFixed(dec):Math.round(v)}</span>`;
}

function Nav(){
  const {scrollY}=useScroll();const [hide,setHide]=useState(false);const [solid,setSolid]=useState(false);
  useMotionValueEvent(scrollY,"change",y=>{const p=scrollY.getPrevious()||0;setHide(y>p&&y>300);setSolid(y>40)});
  return html`<${motion.header} className=${"nav"+(solid?" s":"")} animate=${{y:hide?"-110%":"0%"}} transition=${{duration:.4,ease}}>
    <div className="wrap"><a className="logo" href="#top">Pals <b>Hotel</b></a>
    <nav className="links"><a href="#rooms">Rooms</a><a href="#banquet">Banquets</a><a href="#dining">Dining</a><a href="#gallery">Gallery</a><a href="#contact">Contact</a><a className="btn" href=${BOOK}>Book Now</a></nav></div><//>`;
}

function Hero(){
  const ref=useRef(null);
  const {scrollYProgress:p}=useScroll({target:ref,offset:["start start","end end"]});
  const clip=useTransform(p,v=>{const k=1-Math.min(v/.6,1);return "inset("+38*k+"% "+16*k+"% "+8*k+"% "+16*k+"% round "+44*k+"px)"});
  const ty=useTransform(p,[0,.4],[0,-90]);const to=useTransform(p,[0,.35],[1,0]);
  const sr=useTransform(p,[0,1],[0,220]);const oo=useTransform(p,[.6,.85],[0,1]);const oy=useTransform(p,[.6,.85],[40,0]);const ho=useTransform(p,[0,.1],[1,0]);
  return html`<section className="hero" id="top" ref=${ref}><div className="stage">
    <${Wave} cls="hw" cols=${["#bdeccb","#d9f4df","#f1fbf3"]}/>
    <${motion.div} className="frame" style=${{clipPath:clip,WebkitClipPath:clip}}><${Photo} label="Main banner photo" sub="Hotel exterior or lobby · 1920 × 1080"/><//>
    <${motion.div} className="ttl" style=${{y:ty,opacity:to}}>
      <!-- TODO: Verify Pals Hotel's actual location before publishing. -->
      <div className="eyebrow">Location to be confirmed</div>
      <h1><${Words} text="Stay close to everything." delay=${.2}/></h1>
    <//>
    <${motion.div} className="over" style=${{opacity:oo,y:oy}}><div className="wrap">
      <h2>Pals Hotel</h2><p><!-- TODO: Replace with verified Pals Hotel description, room count and location. -->
        Hotel details to be confirmed. Contact us to enquire about rooms and amenities.</p>
      <a className="btn" href=${BOOK}>Reserve a Room</a>
    </div><//>
    <${motion.div} className="hint" style=${{opacity:ho}}>Scroll ↓<//>
  </div></section>`;
}

function Booking(){
  return html`<div className="book"><div className="wrap"><${Reveal} y=${30}><div className="sbar">
    <div><label>Check-in</label><input type="date"/></div>
    <div><label>Check-out</label><input type="date"/></div>
    <div><label>Adults</label><select defaultValue="2"><option>1</option><option>2</option><option>3</option><option>4</option></select></div>
    <div><label>Rooms</label><select><option>1</option><option>2</option><option>3</option></select></div>
    <a className="btn" href=${BOOK}>Check Availability</a>
  </div><//></div></div>`;
}

// TODO: Verify room categories, amenities, and descriptions with Pals Hotel before launch.
const ROOMS=[
 {n:"Executive Twin Bed Room",d:"Twin beds with a sofa-cum-bed, walk-in wardrobe, electric kettle and a private shower bathroom.",t:["AC","TV","Kettle","Wardrobe"],u:"executive-twin-bed-room"},
 {n:"Executive Room",d:"Includes Executive Lounge access with coffee, croissants and fruit, plus bathrobes and slippers.",t:["Lounge access","AC","TV","Bathrobes"],u:"executive-room"},
 {n:"Deluxe Room",d:"A spacious room with a minibar, work desk and flat-screen TV with satellite channels.",t:["Minibar","Work desk","Daily housekeeping"],u:"deluxe-room"}];

function Rooms(){
  const ref=useRef(null),tr=useRef(null),dist=useRef(0);
  const {scrollYProgress:p}=useScroll({target:ref,offset:["start start","end end"]});
  useEffect(()=>{const m=()=>{dist.current=Math.max(0,tr.current.scrollWidth-window.innerWidth)};m();window.addEventListener("resize",m);return()=>window.removeEventListener("resize",m)},[]);
  const x=useTransform(p,v=>-v*dist.current);const sx=useSpring(p,{stiffness:120,damping:24});
  return html`<section className="rooms" id="rooms" ref=${ref}><div className="rstick">
    <${motion.div} className="track" ref=${tr} style=${{x}}>
      <div className="intro"><div className="eyebrow">Accommodation</div><h2><${WordsIn} text="Rooms made for a good night's rest"/></h2><p>Air-conditioned, newly renovated and fully equipped. Keep scrolling.</p></div>
      ${ROOMS.map((r,i)=>html`<${motion.article} className="rc" key=${r.n} whileHover=${{y:-10,rotate:i%2?.8:-.8}} transition=${{type:"spring",stiffness:260,damping:18}}>
        <div className="ph"><${Photo} label="Room photo" sub=${r.n+" · 1200 × 800"}/></div>
        <h3>${r.n}</h3><p>${r.d}</p>
        <div className="tags">${r.t.map(t=>html`<i key=${t}>${t}</i>`)}</div>
        <div className="row"><a className="l" href="#contact">View details →</a><a className="btn" href=${BOOK}>Book</a></div>
      <//>`)}
    <//>
    <div className="prog"><${motion.div} style=${{scaleX:sx}}/></div>
  </div></section>`;
}

function Stats(){
  return html`<div className="stats"><div className="wrap sg">
    <${Reveal} className="sc c0"><b>—</b><span>Room count to be confirmed</span><//>
    <${Reveal} className="sc c1" delay=${.1}><b>—</b><span>Banquet capacity to be confirmed</span><//>
    <${Reveal} className="sc c2" delay=${.2}><b>—</b><span>Guest rating to be verified</span><//>
    <${Reveal} className="sc c3" delay=${.3}><b>24×7</b><span>Reception & room service</span><//>
  </div></div>`;
}

function Para({label,sub}){
  const ref=useRef(null);const {scrollYProgress:p}=useScroll({target:ref,offset:["start end","end start"]});
  const y=useTransform(p,[0,1],["-9%","9%"]);
  return html`<div className="para" ref=${ref}><${motion.div} style=${{y,height:"120%",marginTop:"-10%"}}><${Photo} label=${label} sub=${sub}/><//></div>`;
}

const Split=({id,rev,eye,title,text,chips,label,sub})=>html`<section className=${"wrap split"+(rev?" r":"")} id=${id}>
  <${Reveal}><${Para} label=${label} sub=${sub}/><//>
  <${Reveal} className="tx" delay=${.15}><div className="eyebrow">${eye}</div><h2><${WordsIn} text=${title}/></h2><p>${text}</p><div className="chips">${chips.map((c,i)=>html`<${motion.i} key=${c} initial=${{opacity:0,scale:.5}} whileInView=${{opacity:1,scale:1}} viewport=${{once:true}} whileHover=${{y:-3,scale:1.06}} transition=${{type:"spring",stiffness:300,damping:16,delay:.3+i*.07}}>${c}<//>`)}</div><//>
</section>`;

function Gallery(){
  const G=[["Lobby","a"],["Banquet hall",""],["Restaurant",""],["Executive room",""],["Night view","a"],["Meeting room",""]];
  return html`<section className="wrap" id="gallery"><div className="gh"><div className="eyebrow">Gallery</div><h2><${WordsIn} text="A look inside"/></h2></div>
  <div className="gal">${G.map((g,i)=>html`<${motion.div} key=${g[0]} className=${g[1]} initial=${{opacity:0,scale:.92}} whileInView=${{opacity:1,scale:1}} viewport=${{once:true,margin:"-40px"}} transition=${{duration:.7,delay:(i%3)*.1,ease}} whileHover=${{scale:1.03,rotate:i%2?1:-1}}><${Photo} label="Photo" sub=${g[0]}/><//>`)}</div></section>`;
}

function Enquiry(){
  const [sent,setSent]=useState(false);
  return html`<div className="wrap"><${Reveal}><div className="enq">
    <div><div className="eyebrow">Banquets & events</div><h2><${WordsIn} text="Planning a wedding or corporate event?"/></h2><p>Share your event requirements. Confirm venue capacity and availability with the hotel.</p></div>
    <div className="form"><input placeholder="Your name"/><input placeholder="Phone number"/>
      <select><option>Wedding</option><option>Corporate event</option><option>Anniversary</option><option>Family function</option></select>
      <input placeholder="Date & number of guests"/>
      <button className="btn" onClick=${()=>setSent(true)}>${sent?"Demo only — not submitted":"Request a Call Back (demo)"}</button></div>
  </div><//></div>`;
}

function App(){
  const {scrollYProgress}=useScroll();const sx=useSpring(scrollYProgress,{stiffness:120,damping:30});
  return html`<${MotionConfig} reducedMotion="user">
    <${motion.div} id="bar" style=${{scaleX:sx}}/>
    <${Nav}/><${Hero}/><${Booking}/><${Marquee}/><${Rooms}/><${Stats}/>
